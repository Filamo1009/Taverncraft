<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TavernCraft Mobile Design QA Comparison</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 18px; color: #f3f0e8; background: #090a0e; font: 600 14px/1.4 system-ui, sans-serif; }
        main { display: flex; justify-content: center; gap: 28px; align-items: flex-start; }
        figure { width: 390px; margin: 0; overflow: hidden; border: 1px solid #2e313a; border-radius: 12px; background: #111319; }
        figcaption { padding: 10px 14px; border-bottom: 1px solid #2e313a; }
        .stage { width: 390px; min-height: 844px; display: flex; align-items: flex-start; justify-content: center; background: #08090d; }
        .reference { width: 390px; height: auto; }
        .implementation { width: 390px; height: 844px; object-fit: contain; object-position: top; }
    </style>
</head>
<body>
    <main>
        <figure><figcaption>参考设计 · 04 移动聊天（原样机按宽度放大）</figcaption><div class="stage"><img class="reference" src="reference-mobile.png" alt="参考设计移动聊天"></div></figure>
        <figure><figcaption>当前实现 · 390 × 844</figcaption><div class="stage"><img class="implementation" src="implementation-mobile.png" alt="当前实现移动聊天"></div></figure>
    </main>
</body>
</html>
